{% extends "base.html" %}
{% load static %}

{% block title %}홈 - My Site{% endblock %}

{% block content %}
<div class="home-container">
    <h1>환영합니다! 🎉</h1>
    <p>우리 사이트에 오신 것을 환영합니다.</p>
    
    {% if user.is_authenticated %}
        <p>안녕하세요, {{ user.username }}님!</p>
    {% else %}
        <p>로그인하여 더 많은 기능을 이용해보세요.</p>
        <a href="{% url 'login' %}" class="btn">로그인</a>
        <a href="{% url 'signup' %}" class="btn">회원가입</a>
    {% endif %}
</div>
{% endblock %}

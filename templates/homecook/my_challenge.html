{% extends 'base.html' %}

{% block title %}나의 챌린지 - 오늘의 집 쿡{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📸 나의 챌린지 - 오늘의 집 쿡</h2>
        <div>
            <span class="badge bg-secondary">Home</span>
            <a href="{% url 'homecook:create_select' %}" class="btn btn-success btn-sm ms-2">+ 새 콘텐츠</a>
        </div>
    </div>
    
    <!-- 8개 썸네일 그리드 (2행 4열) -->
    <div class="row g-3">
        {% for i in "12345678" %}
            <div class="col-md-3">
                <a href="{% url 'homecook:create_select' %}" class="text-decoration-none">
                    <div class="card challenge-card">
                        <div class="card-body text-center p-4">
                            <div class="challenge-number">#{{ i }}</div>
                            <div class="challenge-date">2026-02-0{{ i }}</div>
                        </div>
                    </div>
                </a>
            </div>
        {% endfor %}
    </div>
</div>

<style>
    .challenge-card {
        height: 150px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        border: none;
    }
    
    .challenge-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    .challenge-number {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .challenge-date {
        font-size: 0.9rem;
        opacity: 0.9;
    }
</style>
{% endblock %}
EOF
